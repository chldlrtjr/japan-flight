name: ✈️ JapanFlight - Hourly Crawl & Deploy to GitHub Pages

on:
  schedule:
    # ⏰ 매 1시간마다 자동 실행 (정각)
    - cron: '0 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # GitHub 웹에서 [Run workflow] 버튼으로 즉시 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  crawl_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Python 세팅 & 크롤러 실행
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m playwright install --with-deps chromium || true

      - name: 🚀 Run Flight & News Crawler
        run: |
          python crawler/runner.py

      # 2. 업데이트된 최신 데이터를 Git에 커밋 & 푸시
      - name: 💾 Commit & Push updated flight data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ web/public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update flight deals & news [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main || echo "Git push skipped or up to date"
          fi

      # 3. Node.js 세팅 & Next.js 정적 사이트 빌드
      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 📦 Install Web dependencies
        working-directory: ./web
        run: npm ci

      - name: 🏗️ Build Static Web (GitHub Pages Export)
        working-directory: ./web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # 4. GitHub Pages 배포
      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
